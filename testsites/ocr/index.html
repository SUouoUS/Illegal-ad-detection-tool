<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>이미지 속 글자 테스트</title>
<style>body{font-family:sans-serif;margin:16px} figure{display:inline-block;margin:8px;vertical-align:top} img{max-width:360px;border:1px solid #ddd} .hid{display:none}</style>
</head>
<body>
<h1>이미지 배너 모음</h1>
<figure class="c-ad-ko"><img src="img/ad_ko.png" alt="배너1"></figure>
<figure class="c-ad-en"><img src="img/ad_en.png" alt="banner2"></figure>
<figure class="c-insurance"><img src="img/insurance.png" alt="보험"></figure>
<figure class="c-ai"><img src="img/ai_service.png" alt="AI 서비스"></figure>
<figure class="c-news"><img src="img/game_news.png" alt="게임 뉴스"></figure>
<figure class="c-prevent"><img src="img/prevention.png" alt="도박 예방"></figure>
<figure class="c-small"><img src="img/small_text.png" alt=""></figure>
<figure class="c-low"><img src="img/low_contrast.png" alt=""></figure>
<figure class="c-multi"><img src="img/multiline.png" alt=""></figure>
<figure class="c-sep"><img src="img/separated.png" alt=""></figure>
<figure class="c-jamo"><img src="img/jamo.png" alt=""></figure>
<figure class="c-full"><img src="img/fullwidth.png" alt=""></figure>
<figure class="c-big"><img src="img/big.png" alt="" width="360"></figure>
<figure class="c-repeat"><img src="img/ad_ko.png" alt="같은 배너 반복"></figure>
<figure class="c-broken"><img src="img/missing.png" alt="없는 이미지"></figure>
<figure class="c-lazy"><img src="img/placeholder.gif" data-src="img/lazy_ad.png" loading="lazy" alt="지연 로딩"></figure>
<figure class="c-srcset"><img src="img/small.png" srcset="img/small.png 1x, img/ad_2x.png 2x" alt="고해상도"></figure>
<figure class="c-hidden hid"><img src="img/hidden_ad.png" alt=""></figure>
</body>
</html>
